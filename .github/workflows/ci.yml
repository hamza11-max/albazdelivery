name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate --schema=./prisma/schema.prisma

    - name: Run type checking
      run: npm run type-check

    - name: Vendor app type checking
      run: npm run type-check:vendor

    - name: Run linting
      run: npm run lint

    - name: Verify awaited applyRateLimit in API routes
      run: npm run check:rate-limit

    - name: Run tests (API coverage)
      run: npm run test:api -- --coverage --coverageDirectory=coverage-api
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        NEXTAUTH_SECRET: test_secret
        NEXTAUTH_URL: http://localhost:3000

    - name: Run tests (UI coverage)
      run: npm run test:jest-ui -- --ci --coverage --coverageDirectory=coverage-ui --maxWorkers=2
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        NEXTAUTH_SECRET: test_secret
        NEXTAUTH_URL: http://localhost:3000

    - name: Run Playwright E2E
      run: npx playwright test tests-e2e/
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        NEXTAUTH_SECRET: test_secret
        NEXTAUTH_URL: http://localhost:3000

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage-api/coverage-final.json,./coverage-ui/coverage-final.json