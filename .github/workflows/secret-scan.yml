name: Secret scan

on:
  push:
    branches: [ main, pos-reset ]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans the commits in this push / PR. Old leaks in history are handled by
      # rotating the secrets and purging history, not by this check.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
