name: POS

# Checks for apps/pos and packages/pos-core only. Runs separately from ci.yml / pr-check.yml, whose root
# type-check still fails on legacy code (see docs/PRODUCT_SPEC_AND_ANALYSIS.md, Pass 2).
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/pos/**'
      - 'packages/pos-core/**'
      - 'package-lock.json'
      - '.github/workflows/pos.yml'
  pull_request:
    paths:
      - 'apps/pos/**'
      - 'packages/pos-core/**'
      - 'package-lock.json'
      - '.github/workflows/pos.yml'

jobs:
  check:
    name: Type-check and unit tests
    runs-on: ubuntu-latest
    env:
      # Unit tests do not launch Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only these workspaces' dependencies; skips the root postinstall (Prisma).
      - name: Install dependencies
        run: npm ci --workspace=@albaz/pos --workspace=@albaz/pos-core --ignore-scripts

      - name: Type-check
        run: |
          npm run type-check -w @albaz/pos-core
          npm run type-check -w @albaz/pos

      - name: Unit tests
        run: |
          npm test -w @albaz/pos-core
          npm test -w @albaz/pos

  electron:
    name: Database, smoke test and receipts (Electron, Windows)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --workspace=@albaz/pos --workspace=@albaz/pos-core --ignore-scripts
          node node_modules/electron/install.js

      # better-sqlite3 for Electron's ABI (prebuilt download, compiles if none).
      - name: Build native modules for Electron
        run: npm run rebuild:native -w @albaz/pos

      - name: Database tests (migrations and schema rules)
        run: npm run test:db -w @albaz/pos

      - name: Build app
        run: npm run build -w @albaz/pos

      - name: Smoke test (window, bridge, IPC, migrations, catalog, import)
        run: npx electron apps/pos --smoketest --data-dir=apps/pos/receipts/smoke-data --import-file=apps/pos/test-fixtures/import-sample.csv --screenshot=apps/pos/receipts/shell.png

      - name: Render every receipt variant
        run: npx electron apps/pos --selftest --out=apps/pos/receipts

      - name: Check output
        shell: bash
        run: |
          count=$(ls apps/pos/receipts/*-mono.png | wc -l)
          echo "rendered $count receipts"
          test "$count" -eq 6

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-output
          path: apps/pos/receipts/
          if-no-files-found: warn
