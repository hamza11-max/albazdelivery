name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Typecheck (root)
        run: npm run type-check

      - name: Typecheck (vendor app)
        run: npm run type-check:vendor

      - name: Verify awaited applyRateLimit in API routes
        run: npm run check:rate-limit

      - name: Run API tests (mocked, no DB)
        run: npm run test:api

      - name: Run UI Jest tests
        run: npm run test:jest-ui -- --ci --runInBand

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Phase 4 verification (parity + CSRF lint + phased E2E)
        run: npm run verify:phase-4

      - name: npm audit (critical only)
        run: npm audit --audit-level=critical
        continue-on-error: true
