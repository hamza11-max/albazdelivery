<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AL-baz POS - print test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="panel">
      <h1>Print test</h1>
      <p class="hint">Phase 2 spike: check Arabic/French receipts and the cash drawer on a real printer.</p>

      <fieldset>
        <legend>Receipt</legend>
        <label>Language
          <select id="lang">
            <option value="mixed">Arabic + French</option>
            <option value="ar">Arabic</option>
            <option value="fr">French</option>
          </select>
        </label>
        <label>Paper
          <select id="paper">
            <option value="80">80 mm (576 dots)</option>
            <option value="58">58 mm (384 dots)</option>
          </select>
        </label>
        <div class="buttons">
          <button id="preview">Preview</button>
          <button id="save">Save PNG…</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Printer</legend>
        <label>Connection
          <select id="kind">
            <option value="windows">USB / Windows printer</option>
            <option value="tcp">Network (IP, port 9100)</option>
          </select>
        </label>
        <label id="printer-row">Windows printer
          <select id="printer"></select>
        </label>
        <div id="tcp-row" hidden>
          <label>IP address <input id="host" placeholder="192.168.1.100" autocomplete="off"></label>
          <label>Port <input id="port" type="number" value="9100" min="1" max="65535"></label>
        </div>
        <label class="check"><input id="drawer-after" type="checkbox"> Open drawer after printing</label>
        <div class="buttons">
          <button id="print-a" title="HTML page through the Windows driver">Print A: driver</button>
          <button id="print-b" class="primary" title="Bitmap sent as raw ESC/POS">Print B: raster</button>
          <button id="drawer">Open drawer</button>
        </div>
      </fieldset>

      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="preview">
      <img id="receipt" alt="Receipt preview (1-bit, as printed by route B)">
      <p id="dims" class="hint"></p>
    </section>
  </main>
  <script type="module" src="../dist/renderer/renderer.js"></script>
</body>
</html>
