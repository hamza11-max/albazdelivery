appId: com.albaz.vendor
productName: AlBaz Vendor
copyright: Copyright © 2024 AlBaz Delivery

directories:
  buildResources: build
  output: dist
  app: .

files:
  - 'out/**/*'
  - '.next/standalone/**/*'
  - '.next/static/**/*'
  - 'electron/**/*'
  - 'assets/**/*'
  - 'package.json'
  - 'node_modules/**/*'
  - '!node_modules/.cache'
  - '!node_modules/**/*.{md,ts,map}'
  - '!**/*.{md,ts,map}'

# Unpack standalone so Node can run server.js (asar is read-only for child processes)
# Unpack native .node modules so they load on Windows
# Unpack app icon: Windows nativeImage / taskbar load from real paths (not inside app.asar)
asarUnpack:
  - '.next/standalone/**/*'
  - '.next/static/**/*'
  - 'node_modules/better-sqlite3/**/*'
  - 'assets/logo.ico'

extraMetadata:
  main: electron/main.js

# Avoid rename ENOENT: use exe name without space; build one arch at a time if needed
win:
  executableName: AlBazVendor
  # Bundle Node.js so the exe runs without Node installed (run node scripts/download-node-win.js before build)
  extraResources:
    - from: build/node
      to: node
  # Copy .next/standalone and .next/static next to exe so the app finds server (avoids asar/gitignore issues)
  # Copy vendor-config template next to exe - rename to vendor-config.json and set DATABASE_URL for cloud sync
  extraFiles:
    - from: .next/standalone
      to: .next/standalone
    - from: .next/static
      to: .next/static
    - from: vendor-config.json.example
      to: vendor-config.json
    # Written by scripts/write-bundled-flavor.js before pack (shop type preset per installer vertical)
    - from: bundled-flavor.json
      to: bundled-flavor.json
  # true runs signtool/rcedit on the unpacked exe/resources (electron-builder pulls winCodeSign).
  # On typical Windows setups without symlink privilege (or Developer Mode OFF), unpacking that
  # cache fails with: "Cannot create symbolic link : A required privilege is not held by the client".
  # false skips that path for unsigned local builds — NSIS shortcuts still use build/icon.ico.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: x64
  # Use build/icon.ico (buildResources) so exe and shortcuts get the icon when installed
  icon: build/icon.ico
  # Match executableName — avoid ${productName} here: sanitization can differ (e.g. AlBaz-Vendor vs
  # AlBaz.Vendor) and break auto-update when latest.yml path != the real GitHub asset name.
  artifactName: AlBazVendor-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AlBaz Vendor
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/logo.icns
  category: public.app-category.business

linux:
  target:
    - AppImage
    - deb
  icon: assets/logo.png
  category: Office

publish:
  provider: github
  owner: hamza11-max
  repo: albazdelivery
  channel: latest

